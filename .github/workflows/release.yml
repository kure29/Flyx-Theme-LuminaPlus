name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      publish:
        description: "按 theme.json 的 version 打 tag 并发布 Release"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # FLYX「检查更新」拿最新 Release 的 tag（去掉 v）和 theme.json 的 version 比较，两者必须一致。
      - name: Check version
        id: version
        run: |
          THEME=$(node -p 'require("./theme.json").version')
          PKG=$(node -p 'require("./package.json").version')
          [ "$THEME" = "$PKG" ] || { echo "::error::theme.json $THEME, package.json $PKG"; exit 1; }
          API=$(node -p 'require("./theme.json").flyxApi')
          [ "$API" = "1" ] || { echo "::error::theme.json flyxApi 应为 1，实际 $API"; exit 1; }
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            [ "$GITHUB_REF_NAME" = "v$THEME" ] || { echo "::error::tag $GITHUB_REF_NAME, theme.json v$THEME"; exit 1; }
          fi
          echo "tag=v$THEME" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run package

      # 根目录直接是 theme.json、preview.png、dist/，不套目录；大小不超过 FLYX 的限制。
      - name: Check package
        run: |
          tar tzf theme.tar.gz | sort > files.txt
          grep -qx 'theme.json' files.txt || { echo "::error::包里没有 theme.json"; exit 1; }
          grep -qx 'dist/index.html' files.txt || { echo "::error::包里没有 dist/index.html"; exit 1; }
          COUNT=$(wc -l < files.txt)
          SIZE=$(stat -c %s theme.tar.gz)
          mkdir -p .theme-check && tar xzf theme.tar.gz -C .theme-check
          UNPACKED=$(du -sb --apparent-size .theme-check | cut -f1)
          BIGGEST=$(find .theme-check -type f -printf '%s\n' | sort -n | tail -1)
          echo "entries=$COUNT size=$SIZE unpacked=$UNPACKED biggest=$BIGGEST"
          [ "$SIZE" -le $((32*1024*1024)) ] || { echo "::error::包超过 32 MiB"; exit 1; }
          [ "$UNPACKED" -le $((64*1024*1024)) ] || { echo "::error::解压后超过 64 MiB"; exit 1; }
          [ "$COUNT" -le 2000 ] || { echo "::error::条目超过 2000"; exit 1; }
          [ "$BIGGEST" -le $((8*1024*1024)) ] || { echo "::error::有文件超过 8 MiB"; exit 1; }
          rm -rf .theme-check files.txt
          sha256sum theme.tar.gz | cut -d' ' -f1 | tee theme.tar.gz.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: flyx-theme-luminaplus
          path: |
            theme.tar.gz
            theme.tar.gz.sha256

      # 推 tag 触发，或手动运行时勾选 publish：创建 Release（已存在时补传主题包）。
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/') || (inputs.publish && github.ref == 'refs/heads/main')
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" theme.tar.gz theme.tar.gz.sha256 --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" theme.tar.gz theme.tar.gz.sha256 \
              --target "$GITHUB_SHA" --title "$TAG" --generate-notes --latest --repo "$GITHUB_REPOSITORY"
          fi
